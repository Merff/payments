x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payments
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    API_KEY: secret
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: pg_isready -U postgres -d payments
      interval: 2s
      retries: 3
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      retries: 3
      start_period: 30s

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 2s
      retries: 3
      start_period: 30s

  consumer:
    <<: *app
    command: faststream run app.worker:app
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
